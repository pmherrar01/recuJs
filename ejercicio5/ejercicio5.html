<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concesionario Nivel DAW</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

    <h1>Panel de Gestión - Concesionario</h1>
    
    <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc;">
        <h3>Añadir Vehículo</h3>
        <input type="text" id="marca" placeholder="Marca (ej. Seat)">
        <input type="text" id="modelo" placeholder="Modelo (ej. Leon)">
        <input type="number" id="precio" placeholder="Precio (€)">
        <input type="number" id="anio" placeholder="Año">
        
        <button id="btnAnadir">Añadir Coche</button>
    </div>

    <div style="margin-bottom: 20px;">
        <button id="btnFiltrarBaratos">Mostrar Coches < 10.000€</button>
        <button id="btnCalcularMedia">Calcular Precio Medio</button>
    </div>

    <table border="1" width="100%" style="border-collapse: collapse; text-align: center;">
        <thead style="background-color: #f2f2f2;">
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Precio (€)</th>
                <th>Año</th>
            </tr>
        </thead>
        <tbody id="cuerpoTablaCoches">
            </tbody>
    </table>

    <script src="ejercicio5.js"></script>
</body>
</html>
