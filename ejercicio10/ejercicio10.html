<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout de Entradas</title>
    <style>
        body { font-family: Arial; padding: 20px; background-color: #f4f4f9; }
        .formulario { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 12px; display: none; margin-top: 5px; }
        .input-error { border-color: red; background-color: #ffe6e6; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Completa tu compra 🎟️</h1>

    <div class="formulario">
        <form id="formCompra">
            <div class="input-group">
                <label>Nombre Completo:</label>
                <input type="text" id="nombre">
                <span class="error" id="errorNombre">El nombre debe tener al menos 3 letras.</span>
            </div>

            <div class="input-group">
                <label>DNI / NIE:</label>
                <input type="text" id="dni" placeholder="Ej: 12345678A">
                <span class="error" id="errorDni">Formato DNI inválido (8 números y 1 letra).</span>
            </div>

            <div class="input-group">
                <label>Correo Electrónico:</label>
                <input type="text" id="email" placeholder="ejemplo@correo.com">
                <span class="error" id="errorEmail">Debes introducir un email válido.</span>
            </div>

            <div class="input-group">
                <label>Fecha de Nacimiento:</label>
                <input type="date" id="fechaNac">
                <span class="error" id="errorFecha">Debes ser mayor de 18 años para comprar entradas.</span>
            </div>

            <button type="button" id="btnComprar">Pagar Entradas</button>
        </form>
    </div>

    <script src="ejercicio10.js"></script>
</body>
</html>
